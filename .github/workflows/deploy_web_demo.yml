name: Deploy Live Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages is served from the gh-pages branch ("Deploy from a branch"), so the
# build is pushed there. The previous actions/deploy-pages flow needed the
# github-pages environment to allow `main`, which it doesn't — every run
# failed and the live demo stayed on v1.7.1.
permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get

      - name: Build Web App
        run: |
          cd example
          flutter build web --release --base-href "/hyper_render/"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: example/build/web
          publish_branch: gh-pages
          force_orphan: true   # keep gh-pages to a single commit, no history bloat
          commit_message: "deploy: live web demo"
